name: Release bundle
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Behavioral regressions
        run: python -B -m unittest discover -s tests -v
      - name: Build .skill bundle
        run: python -B scripts/validate-skill-bundle.py . --pack task-observer.skill
      - name: Attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" task-observer.skill --repo "$GITHUB_REPOSITORY"
